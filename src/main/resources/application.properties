# --- DataSource ---
# In prod/dev la URL è esplicita; in test resta non configurata → Quarkus Dev Services
# avvia automaticamente un PostgreSQL in container (Testcontainers, serve Docker).
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:schedina}
%prod.quarkus.datasource.password=${DB_PASSWORD:schedina}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/schedina}

# --- Hibernate ---
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
quarkus.flyway.migrate-at-start=true

# --- Jackson ---
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non_null

# --- JWT ---
app.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
app.jwt.expiration-hours=24

# --- CORS ---
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.exposed-headers=Content-Type,Authorization
quarkus.http.cors.access-control-max-age=24H

# --- Scheduler ---
# Apertura/chiusura automatica concorsi. Disattivato in test: lo scheduler si invoca a mano in modo deterministico.
%test.quarkus.scheduler.enabled=false

# --- Dev profile overrides ---
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.datasource.username=schedina
%dev.quarkus.datasource.password=schedina
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/schedina
