# --- DataSource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:schedina}
quarkus.datasource.password=${DB_PASSWORD:schedina}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/schedina}

# --- Hibernate ---
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
quarkus.flyway.migrate-at-start=true

# --- Jackson ---
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non_null

# --- JWT ---
app.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
app.jwt.expiration-hours=24

# --- CORS ---
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.exposed-headers=Content-Type,Authorization
quarkus.http.cors.access-control-max-age=24H

# --- Dev profile overrides ---
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/schedina
