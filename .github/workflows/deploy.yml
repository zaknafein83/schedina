name: deploy

# Si attiva su push a main (deploy in produzione) e manualmente.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancella deploy precedenti se ne arriva uno nuovo sullo stesso ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # serve per pushare su ghcr.io

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/schedina

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (per il docker-compose.yml)
        uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload docker-compose.yml
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              docker-compose.yml \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/schedina/docker-compose.yml

      - name: Deploy
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash <<EOF
            set -euo pipefail
            cd /opt/schedina
            echo "TAG=${TAG}" > .deploy-tag
            echo "[deploy] pulling image ghcr.io/zaknafein83/schedina:${TAG}"
            TAG=${TAG} docker compose pull
            echo "[deploy] up -d"
            TAG=${TAG} docker compose up -d
            echo "[deploy] stato container:"
            TAG=${TAG} docker compose ps
          EOF

      - name: Healthcheck
        run: |
          echo "Aspetto che l'app risponda su /q/health/ready ..."
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                 "curl -fsS --max-time 3 http://127.0.0.1:8080/q/health/ready > /dev/null"; then
              echo "✅ healthcheck OK al tentativo $i"
              exit 0
            fi
            echo "  tentativo $i fallito, riprovo tra 5s..."
            sleep 5
          done
          echo "::error::healthcheck non passato dopo 100s"
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/schedina && docker compose logs --tail=80 app" || true
          exit 1
